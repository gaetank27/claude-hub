<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4886a"/>
      <stop offset="1" stop-color="#b15a39"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="0.8"/>
  <!-- spokes: center to each of the 6 hexagonal nodes -->
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <line x1="32" y1="32" x2="32"   y2="14"/>
    <line x1="32" y1="32" x2="47.6" y2="23"/>
    <line x1="32" y1="32" x2="47.6" y2="41"/>
    <line x1="32" y1="32" x2="32"   y2="50"/>
    <line x1="32" y1="32" x2="16.4" y2="41"/>
    <line x1="32" y1="32" x2="16.4" y2="23"/>
  </g>
  <!-- outer nodes -->
  <g fill="#fff">
    <circle cx="32"   cy="14" r="4.4"/>
    <circle cx="47.6" cy="23" r="4.4"/>
    <circle cx="47.6" cy="41" r="4.4"/>
    <circle cx="32"   cy="50" r="4.4"/>
    <circle cx="16.4" cy="41" r="4.4"/>
    <circle cx="16.4" cy="23" r="4.4"/>
  </g>
  <!-- center hub: white disc with a clean background-colored hole over the spokes -->
  <circle cx="32" cy="32" r="6.8" fill="#fff"/>
  <circle cx="32" cy="32" r="3.2" fill="url(#bg)"/>
</svg>
