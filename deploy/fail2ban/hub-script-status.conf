# fail2ban filter for the Claude Hub script-status endpoint.
# Install: sudo cp deploy/fail2ban/hub-script-status.conf /etc/fail2ban/filter.d/
#
# Log line format (written by internal/scriptstatus, one per failed authentication):
#   2026-10-11 14:03:22 script-status AUTH-FAIL ip=203.0.113.9 script=demo reason=bad-key
# "BLOCKED" lines (requests refused by the application-level ban) are deliberately
# NOT matched: they would only extend bans that already exist.
[Definition]
failregex = ^\s*script-status AUTH-FAIL ip=<ADDR> script=\S+ reason=\S+\s*$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
